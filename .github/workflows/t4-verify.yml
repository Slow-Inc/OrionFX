# T4 verify — the server-side ship gate.
#
# Jobs: `guards` (the three .githooks scripts), and the backend `lint`,
# `typecheck`, `test` (P1 Foundation, issue #5), and `frontend` (M01 dashboard: Biome lint,
# tsc, Vitest, Vite build).
# Keep `.claude/t4.json` "verify" a literal prefix of these jobs, so the local
# gate fails for the same reasons, sooner.
#
# `guards` notes: `check-tree-budget` reads uncommitted files, and a fresh CI
# checkout has none, so in CI it only proves the checkout is clean. The
# issue-ref and gate-ledger checks are the ones that bind in CI. The branch is
# checked out by name because the default detached HEAD would hide `wip/*` and
# `feat/<n>-...` names from the scripts.
#
# Slow-Inc is on the GitHub free plan, so no check can be made a required
# status check on this private repo. `.claude/t4.json` "requireGreenCI": true is
# the (weaker) fallback — it binds agent-run `gh pr merge` only, not a web merge.
name: T4 verify

# PR-only: every change reaches main through a PR, and the branch-scoped guards
# have nothing to check on a push to main.
on:
  pull_request:
    branches: [main]

concurrency:
  group: t4-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  guards:
    runs-on: ubuntu-latest
    env:
      # A Dependabot PR carries no T4-Gates trailer and no issue reference, and
      # `@dependabot rebase` would drop any added by hand (#93). Both process checks are
      # skipped only while Dependabot both opened the PR and triggered this run: once a
      # person pushes to the branch, the actor changes and they bind again. Every other
      # check and job still runs. A re-run keeps the original actor; a later
      # `@dependabot rebase` restores the skip but discards any non-Dependabot commits.
      DEPENDABOT_ONLY: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: name the branch (scripts read it via git rev-parse)
        run: git checkout -B "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
      - run: sh .githooks/check-tree-budget
      - name: check-gate-ledger
        if: env.DEPENDABOT_ONLY != 'true'  # env values are strings
        run: sh .githooks/check-gate-ledger
        env:
          BASE_REF: origin/${{ github.base_ref }}
      - name: check-issue-ref
        if: env.DEPENDABOT_ONLY != 'true'  # env values are strings
        run: PR_BODY="$(gh pr view "${{ github.event.number }}" --json body -q .body)" sh .githooks/check-issue-ref
        env:
          BASE_REF: origin/${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5  # pinned: a new Bun must not change CI on its own
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
